services:
  tournament:
    build: .
    container_name: unmatched-tournament
    ports:
      - "8742:8742"
    # PASSWORD_HASH and SECRET_KEY come from .env (gitignored); see .env.example.
    env_file: .env
    environment:
      PORT: "8742"
      HTML_FILE: "generated/tournament_a.html"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true